name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate workflows
        run: python ai-factory-vendemais-main/ai-factory-vendemais-main/tests/validate_workflows.py

      - name: Test enrichment logic
        run: python ai-factory-vendemais-main/ai-factory-vendemais-main/tests/test_enrichment_logic.py
